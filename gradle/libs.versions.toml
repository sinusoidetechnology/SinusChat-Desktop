[versions]
kotlin = "2.3.21"
compose = "1.12.1"
material3 = "1.9.0"
serialization = "1.11.0"
coroutines = "1.10.2"
zxing = "3.5.3"
jmdns = "3.6.4"
jna = "5.19.1"
junit = "4.13.2"
webrtc = "0.19.0"
vorbisspi = "1.0.3.3"
javacv = "1.5.14"
ffmpeg = "8.1.2-1.5.14"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "material3" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
vorbisspi = { group = "com.googlecode.soundlibs", name = "vorbisspi", version.ref = "vorbisspi" }
webrtc-java = { group = "dev.onvoid.webrtc", name = "webrtc-java", version.ref = "webrtc" }
javacpp = { group = "org.bytedeco", name = "javacpp", version.ref = "javacv" }
ffmpeg = { group = "org.bytedeco", name = "ffmpeg", version.ref = "ffmpeg" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
